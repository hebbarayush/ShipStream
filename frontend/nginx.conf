server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (React Router): any unknown path falls back to index.html instead of a
    # bare nginx 404, so a deep link like /track/FT-DEMO00001 or /app/shipments/5 works on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames (Vite's build output) are safe to cache hard; index.html is not, since it's
    # what points at the current hashed bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
