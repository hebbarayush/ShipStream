services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowtrack
      POSTGRES_USER: flowtrack
      POSTGRES_PASSWORD: flowtrack
    ports:
      - "5433:5432"   # 5433 to avoid clashing with a local Postgres install
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowtrack"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
