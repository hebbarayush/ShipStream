spring.application.name=shipstream

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/shipstream}
spring.datasource.username=${DB_USER:shipstream}
spring.datasource.password=${DB_PASSWORD:shipstream}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

# Redis is introduced in Phase 6
management.health.redis.enabled=false
management.endpoints.web.exposure.include=health,info
