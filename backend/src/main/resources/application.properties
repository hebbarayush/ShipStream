spring.application.name=shipstream

# DB_URL wins if set (local dev default below). Otherwise built from PGHOST/PGPORT/PGDATABASE, which
# is what lets a platform like Render inject a managed Postgres by individual field (fromDatabase:
# host/port/database) without anyone hand-assembling a JDBC URL.
spring.datasource.url=${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5433}/${PGDATABASE:shipstream}}
spring.datasource.username=${DB_USER:${PGUSER:shipstream}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:shipstream}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# INSECURE DEFAULT, deliberately - this is a demo project. Set JWT_SECRET (32+ bytes) for anything
# beyond local dev; every restart without an override invalidates no existing sessions since the
# default is fixed, but anyone who reads this file can forge tokens against the default secret.
app.security.jwt-secret=${JWT_SECRET:shipstream-demo-jwt-secret-change-me-in-production-32bytes}
# Demo ops login, seeded on startup if it doesn't exist (DemoUserSeeder). Override both for anything
# beyond a local/demo deployment.
app.security.demo-ops-username=${DEMO_OPS_USERNAME:demo}
app.security.demo-ops-password=${DEMO_OPS_PASSWORD:demo1234}
# Cookies need Secure (HTTPS-only) in any real deployment; false here because local dev is plain HTTP.
app.security.cookie-secure=${COOKIE_SECURE:false}

# Comma-separated. Local dev defaults cover `npm run dev` (5173) and `npm run preview` (4173); set
# CORS_ALLOWED_ORIGINS to the deployed frontend's real origin(s) - without it, a deployed frontend
# can't call this API at all (SecurityConfig's CorsConfigurationSource reads this list).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
